<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ales496 | Портфолио</title>
    <style>
        :root { --bg: #0f0f0f; --text: #f0f0f0; --accent: #7b2ff7; --card: #1a1a1a; --secondary: #a0a0a0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        header { padding: 4rem 2rem; text-align: center; background: radial-gradient(circle at center, #251045 0%, var(--bg) 80%); }
        .container { max-width: 1200px; margin: auto; padding: 2rem; }
        section { margin-bottom: 4rem; }
        .section-title { font-size: 1.6rem; border-left: 4px solid var(--accent); padding-left: 1rem; margin-bottom: 1.5rem; }
        .section-hint { color: var(--secondary); margin: -0.75rem 0 1.5rem 1.25rem; max-width: 42rem; line-height: 1.5; }
        
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 1.25rem; align-items: stretch; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.25s ease, box-shadow 0.25s ease; position: relative; border: 1px solid rgba(123, 47, 247, 0.12); display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(123, 47, 247, 0.25); }
        .card .thumb { flex: 1; min-height: 220px; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse 80% 70% at 50% 40%, #2a2040 0%, #0d0d0d 65%); padding: 0.75rem; }
        .card img { width: 100%; height: auto; max-height: min(52vh, 480px); object-fit: contain; object-position: center; display: block; }
        .pixel-art { image-rendering: pixelated; }
        .card-label { padding: 0.65rem 0.75rem; font-size: 0.82rem; text-align: center; color: var(--secondary); border-top: 1px solid rgba(255,255,255,0.06); }

        #modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); justify-content: center; align-items: center; cursor: zoom-out; padding: 1rem; box-sizing: border-box; }
        #modal img { max-width: min(96vw, 1600px) !important; max-height: 92vh !important; width: auto; height: auto; object-fit: contain; border: 1px solid rgba(255,255,255,0.12); border-radius: 4px; image-rendering: auto; }
        #modal img.is-pixel { image-rendering: pixelated; transform: scale(1.5); }

        /* Кнопки */
        .btn { display: inline-block; padding: 0.8rem 1.5rem; background: var(--accent); color: #fff; text-decoration: none; border-radius: 20px; margin: 5px; }
    </style>
</head>
<body>

<header>
    <h1>Олейник Александр</h1>
    <p>Technical 2D Artist | Программист | Выпускник лиц. им. Игоря Виеру</p>
    <a href="https://ales496.itch.io" class="btn">Itch.io Игры</a>
</header>

<div class="container">

    <section>
        <h2 class="section-title">Работы</h2>
        <p class="section-hint">Нажмите на изображение, чтобы открыть крупный просмотр.</p>
        <div class="gallery">
            <div class="card" onclick="openModal(this)">
                <div class="thumb"><img src="images/AethrisTg.png" alt="Aethris" loading="lazy" decoding="async"></div>
                <div class="card-label">Aethris</div>
            </div>
            <div class="card" onclick="openModal(this)">
                <div class="thumb"><img src="images/Aris.png" alt="Aris" loading="lazy" decoding="async"></div>
                <div class="card-label">Aris</div>
            </div>
            <div class="card" onclick="openModal(this)">
                <div class="thumb"><img src="images/Demian.png" alt="Demian" loading="lazy" decoding="async"></div>
                <div class="card-label">Demian</div>
            </div>
            <div class="card" onclick="openModal(this)">
                <div class="thumb"><img src="images/Eris.png" alt="Eris" loading="lazy" decoding="async"></div>
                <div class="card-label">Eris</div>
            </div>
            <div class="card" onclick="openModal(this)">
                <div class="thumb"><img src="images/final.png" alt="Final" loading="lazy" decoding="async"></div>
                <div class="card-label">Final</div>
            </div>
            <div class="card" onclick="openModal(this)">
                <div class="thumb"><img src="images/Mu Lan.png" alt="Mu Lan" loading="lazy" decoding="async"></div>
                <div class="card-label">Mu Lan</div>
            </div>
            <div class="card" onclick="openModal(this)">
                <div class="thumb"><img src="images/queenbee2.png" alt="Queen Bee" loading="lazy" decoding="async"></div>
                <div class="card-label">Queen Bee</div>
            </div>
        </div>
    </section>

</div>

<!-- Modal for full view -->
<div id="modal" onclick="this.style.display='none'">
    <img id="modal-img" src="" alt="Full View">
</div>

<script>
    function openModal(card) {
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const clickedImg = card.querySelector('img');
        
        modalImg.src = clickedImg.src;
        // Если это пиксель-арт, добавляем класс для четкости и масштаба
        if (clickedImg.classList.contains('pixel-art')) {
            modalImg.classList.add('is-pixel');
        } else {
            modalImg.classList.remove('is-pixel');
        }
        
        modal.style.display = 'flex';
    }
</script>

</body>
</html>
